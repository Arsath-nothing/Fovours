<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0a16;--bg2:#12112a;--surface:#16152e;--ink:#f4f3ff;--muted:#a9a7c4;--line:#2a2850;--brand:#8b74ff;--blue:#6b95ff;--hbg:rgba(11,10,22,.9);--sh:0 10px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b0a16;--bg2:#12112a;--surface:#16152e;--ink:#f4f3ff;--muted:#a9a7c4;--line:#2a2850;--brand:#8b74ff;--blue:#6b95ff;--hbg:rgba(11,10,22,.9);--sh:0 10px 30px rgba(0,0,0,.4)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hbg);backdrop-filter:blur(12px);z-index:10}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}
.wrap{max-width:1160px;margin:auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hbg);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}.logo small:empty{display:none}.logo small{font-weight:600;color:var(--brand);font-size:12px;letter-spacing:.12em;text-transform:uppercase;display:block;margin-top:-4px}
.logo svg{width:38px;height:38px;border-radius:11px}.logo img{width:42px;height:42px;object-fit:contain}footer .logo img{filter:drop-shadow(0 0 8px rgba(139,116,255,.6))}
nav{display:flex;gap:4px;margin-left:auto}nav a{padding:8px 13px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}nav a:hover{color:var(--ink)}nav a.on{color:var(--brand);background:var(--bg2)}
.tools{display:flex;gap:8px;align-items:center}
.ib{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:17px;cursor:pointer}
#mb{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:12px;font:600 15px Inter,sans-serif;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-2px)}.btn.p{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 8px 20px rgba(91,61,245,.3)}.btn.g{background:var(--gold);border-color:var(--gold);color:#16120a}
section{padding:72px 0}.alt{background:var(--bg2)}
.eye{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--brand)}
h1,h2,h3{line-height:1.12;letter-spacing:-.025em;margin:.3em 0}
h1{font-size:clamp(34px,6vw,62px);font-weight:800}h2{font-size:clamp(26px,4vw,40px);font-weight:800}h3{font-size:19px;font-weight:700}
.hl{color:var(--brand)}.lead{font-size:clamp(16px,2vw,19px);color:var(--muted);max-width:620px}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:center;padding:56px 20px 40px}.hero>*{min-width:0}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.chip.g{border-color:var(--gold);color:var(--ink);background:rgba(245,166,35,.14)}
.art{position:relative;width:100%;max-width:580px;margin:0 auto;display:grid;place-items:center;isolation:isolate}
.art::before{content:"";position:absolute;inset:4% 2%;z-index:-1;border-radius:50%;background:radial-gradient(closest-side at 75% 62%,rgba(245,166,35,.3),transparent 62%),radial-gradient(closest-side,rgba(91,61,245,.3),rgba(47,107,255,.12) 58%,transparent 74%);filter:blur(10px)}
.art img{width:100%;height:auto;object-fit:contain;filter:drop-shadow(0 18px 26px rgba(40,20,120,.22));transition:transform .25s ease-out}
.art.wide{max-width:760px}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-10px)}}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));margin-top:30px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;transition:.25s}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh);border-color:var(--brand)}
.num{width:38px;height:38px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:12px}.num.g{background:var(--gold);color:#16120a}
.card p{color:var(--muted);margin:.4em 0;font-size:15px}.sm{font-size:13.5px}
ul.ck{list-style:none;padding:0;margin:12px 0 0}ul.ck li{padding:4px 0 4px 26px;position:relative;font-size:14.5px;color:var(--muted)}ul.ck li::before{content:"✦";position:absolute;left:0;color:var(--gold)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.feat{background:linear-gradient(135deg,#1a1240,#2a1a7a 60%,#2f6bff);color:#fff;border-radius:28px;padding:clamp(24px,5vw,52px);position:relative;overflow:hidden}
.feat .lead,.feat p,.feat li{color:#d8d4ff}.feat .eye{color:var(--gold)}.feat .card{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}.feat .card p{color:#d8d4ff}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(245,166,35,.18);color:#b97a00;margin-bottom:8px}
.feat .tag{color:var(--gold)}
.ph{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin-top:16px}
form{display:grid;gap:12px}label{font-size:13px;font-weight:600}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:15px Inter,sans-serif}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
dialog{border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);padding:26px;width:min(440px,92vw)}dialog::backdrop{background:rgba(8,6,25,.6)}
footer{background:#0d0b1f;color:#c9c6e6;padding:48px 0 28px;font-size:14px}footer a:hover{color:var(--gold)}
.fg{display:grid;gap:28px;grid-template-columns:2fr 1fr 1.3fr}footer h4{color:#fff;margin:0 0 10px}footer a{display:block;padding:3px 0}
.view{animation:in .45s ease}@keyframes in{from{opacity:0;transform:translateY(12px)}}
.rv{opacity:0;transform:translateY(18px);transition:.6s}.rv.v{opacity:1;transform:none}
.ph-head{padding:56px 20px 8px}
.tl{border-left:2px solid var(--line);margin:24px 0 0 6px;padding-left:22px}.tl div{margin-bottom:22px;position:relative}.tl div::before{content:"";position:absolute;left:-29px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--gold)}
@media(max-width:900px){.hero,.split{grid-template-columns:1fr}.fg{grid-template-columns:1fr 1fr}#mb{display:block}
nav{position:fixed;left:0;right:0;top:calc(68px + env(safe-area-inset-top,0px));flex-direction:column;background:var(--bg);padding:12px 20px 20px;border-bottom:1px solid var(--line);display:none;margin:0}nav.open{display:flex}nav a{padding:13px}.bar .cta{display:none}.tools{margin-left:auto}section{padding:52px 0}}
@media(max-width:1100px){.bar .cta{display:none}}
@media(max-width:900px){body{overflow-x:clip}.hero,.split{grid-template-columns:minmax(0,1fr)}.hero{padding:28px 20px 16px;gap:20px;text-align:center}.hero .ctas,.hero .chips{justify-content:center}.hero .lead{margin-inline:auto}h1,h2{overflow-wrap:anywhere}.art{max-width:460px}.split{gap:24px}}
@media(max-width:560px){.fg{grid-template-columns:1fr}.ctas .btn{width:100%}.art{max-width:100%}h1{font-size:clamp(30px,9vw,40px)}.card{padding:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

/* ===== Premium header + motion ===== */
header{transition:background .35s,box-shadow .35s,border-color .35s}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--brand),var(--blue),var(--gold),transparent);opacity:.7;background-size:200% 100%;animation:sheen 8s linear infinite}
@keyframes sheen{to{background-position:-200% 0}}
header.sc{box-shadow:0 12px 34px rgba(40,20,140,.16);background:var(--hbg)}
header .bar{transition:height .35s}header.sc .bar{height:58px}
#prog{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--brand),var(--blue),var(--gold));z-index:30;pointer-events:none}
.logo{transition:transform .3s}.logo:hover{transform:scale(1.04)}
.logo img,.logo svg{transition:transform .6s cubic-bezier(.2,.8,.2,1),filter .3s}.logo:hover img,.logo:hover svg{transform:rotate(-8deg) scale(1.08);filter:drop-shadow(0 0 10px rgba(139,116,255,.7))}
@media(min-width:901px){
nav{padding:5px;border:1px solid var(--line);border-radius:999px;background:linear-gradient(180deg,var(--surface),var(--bg2));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 14px rgba(60,40,160,.07);gap:2px}
nav a{position:relative;padding:8px 16px;border-radius:999px;transition:color .25s,background .25s,transform .25s}
nav a:hover{color:var(--ink);background:rgba(91,61,245,.09);transform:translateY(-1px)}
nav a.on{color:#fff;background:linear-gradient(135deg,var(--brand),var(--blue));box-shadow:0 6px 16px rgba(91,61,245,.38)}}
.bar .cta{position:relative;overflow:hidden;border-radius:999px;background:linear-gradient(135deg,var(--brand),var(--blue));box-shadow:0 8px 22px rgba(91,61,245,.38)}
.btn.p::after,.btn.g::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .7s}
.btn.p:hover::after,.btn.g:hover::after{left:130%}
.btn{position:relative;overflow:hidden}.btn:active{transform:scale(.97)}
.ib{transition:transform .3s,border-color .3s,box-shadow .3s}.ib:hover{transform:rotate(25deg) scale(1.06);border-color:var(--brand);box-shadow:0 0 0 4px rgba(91,61,245,.12)}
/* page transition */
.view{animation:vin .75s cubic-bezier(.2,.8,.2,1) both}
@keyframes vin{from{opacity:0;transform:translateY(24px) scale(.985);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
.rv{transform:translateY(34px) scale(.97);filter:blur(6px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1),filter .8s;transition-delay:var(--d,0s)}
.rv.v{filter:blur(0)}
.hero h1,.hero .lead,.hero .ctas,.hero .chips{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.hero .lead{animation-delay:.12s}.hero .ctas{animation-delay:.24s}.hero .chips{animation-delay:.36s}.hero .art{animation:rise 1.1s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.hl{background:linear-gradient(100deg,var(--brand),var(--blue),var(--gold),var(--brand));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s linear infinite}
.card{position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(91,61,245,.14),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover::before{opacity:1}.card:hover{transform:translateY(-6px)}
.num{transition:transform .4s cubic-bezier(.2,.8,.2,1)}.card:hover .num{transform:rotate(-8deg) scale(1.12)}
.alt{position:relative}

.feat::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,rgba(245,166,35,.35),transparent);pointer-events:none}
.feat>*{position:relative;z-index:1}
.pts{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.pts .card{display:flex;align-items:center;gap:12px;padding:15px 18px;overflow-wrap:anywhere}
.pts .st{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:rgba(245,166,35,.2);color:var(--gold);font-size:13px}
.feat .ctas .btn{max-width:100%}
@media(max-width:600px){.feat{border-radius:20px;padding:26px 18px}.feat h2{font-size:clamp(26px,8.5vw,34px)!important}.feat .lead{font-size:15px}.pts{grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.pts .card{flex-direction:column;align-items:flex-start;gap:8px;padding:12px;font-size:13.5px;line-height:1.35}.feat .ctas{flex-direction:column}.feat .ctas .btn{width:100%}}
@media(max-width:340px){.pts{grid-template-columns:1fr}}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(11px,3.5vw,16px);margin:.6em 0}
.fig{margin:0 auto;width:100%;overflow:hidden;border-radius:24px;border:1px solid var(--line);background:#fff;box-shadow:var(--sh)}
.fig img{width:100%;height:auto;display:block;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}.fig:hover img{transform:scale(1.03)}
.fig.p{max-width:560px}.fig.t{max-width:920px}
.fig figcaption{padding:12px 18px;font-size:14px;font-weight:600;color:var(--muted);text-align:center;background:var(--surface);border-top:1px solid var(--line)}
.wa-float{position:fixed;right:20px;bottom:22px;z-index:1000;display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#25d366,#128c7e);box-shadow:0 18px 32px rgba(18,140,126,.35);border:3px solid rgba(255,255,255,.9);transition:transform .2s ease,box-shadow .2s ease}.wa-float:hover{transform:translateY(-4px) scale(1.04);box-shadow:0 22px 38px rgba(18,140,126,.45)}.wa-float svg{width:28px;height:28px;display:block}.google-form-wrap{margin-top:18px;overflow:hidden;border-radius:18px;border:1px solid var(--line);background:var(--surface)}.google-form-wrap iframe{width:100%;min-height:680px;border:0;display:block;background:#fff}.google-form-card p{margin-bottom:0}
@media(max-width:600px){.fig{border-radius:16px}.wa-float{width:56px;height:56px;right:16px;bottom:18px}}
</style>
